<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t">
<title id="t">Ho Le Na. Vision, language, action.</title>
<defs>
<radialGradient id="rose" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d1457f" stop-opacity=".75"/><stop offset="1" stop-color="#d1457f" stop-opacity="0"/></radialGradient>
<radialGradient id="teal" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1fa99a" stop-opacity=".6"/><stop offset="1" stop-color="#1fa99a" stop-opacity="0"/></radialGradient>
<radialGradient id="violet" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6d4fe0" stop-opacity=".7"/><stop offset="1" stop-color="#6d4fe0" stop-opacity="0"/></radialGradient>
<linearGradient id="flowg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fe3cf"/><stop offset=".5" stop-color="#f6d9e6"/><stop offset="1" stop-color="#ff9fc0"/></linearGradient>
<linearGradient id="nameg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd9e8"/></linearGradient>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
<clipPath id="clip"><rect width="1280" height="360" rx="20"/></clipPath>
<style>
.blob{animation:drift 18s ease-in-out infinite alternate}
.b2{animation-duration:23s;animation-direction:alternate-reverse}
.b3{animation-duration:27s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(70px,-28px)}}
.line{fill:none;stroke:#f6d9e6;stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.flow{stroke-dasharray:3 13;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-64}}
.spark{offset-path:path("M150 186C330 40 500 340 690 268S960 60 1012 181");animation:travel 6s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes travel{0%{offset-distance:0%;opacity:0}6%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
.blades{transform-origin:150px 186px;animation:spin 38s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fore{transform-origin:1120px 112px;animation:reach 6s ease-in-out infinite}
@keyframes reach{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.star{animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}
.hover{animation:hover 5s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.w{fill:#f6d9e6;opacity:.42;animation:word 6s ease-in-out infinite}
.w2{animation-delay:2s}.w3{animation-delay:4s}
@keyframes word{0%,36%,100%{opacity:.42;fill:#f6d9e6}10%,26%{opacity:1;fill:#ffffff}}
.rise{opacity:0;animation:rise 1.6s .3s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.rise{opacity:1}.spark{offset-distance:62%}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="#161129"/>
<circle class="blob" cx="260" cy="60" r="330" fill="url(#violet)"/>
<circle class="blob b2" cx="1080" cy="330" r="360" fill="url(#rose)"/>
<circle class="blob b3" cx="700" cy="400" r="280" fill="url(#teal)"/>
<!-- chòm sao mạng nơ-ron -->
<g class="line" stroke-width="1" stroke-opacity=".22">
<path d="M396 70 478 44 560 82 652 52 742 86 836 48M478 44 520 112M652 52 700 108M396 70 430 124M836 48 880 104"/>
<path d="M420 306 506 326 596 298 690 328 786 300 872 322M506 326 470 276M690 328 742 286"/>
</g>
<g fill="#ffffff">
<circle class="star" cx="396" cy="70" r="2.6"/><circle class="star" style="animation-delay:.6s" cx="478" cy="44" r="3.2"/>
<circle class="star" style="animation-delay:1.3s" cx="560" cy="82" r="2.4"/><circle class="star" style="animation-delay:2.1s" cx="652" cy="52" r="3.4"/>
<circle class="star" style="animation-delay:.9s" cx="742" cy="86" r="2.6"/><circle class="star" style="animation-delay:2.8s" cx="836" cy="48" r="3"/>
<circle class="star" style="animation-delay:1.7s" cx="520" cy="112" r="2"/><circle class="star" style="animation-delay:3.2s" cx="700" cy="108" r="2"/>
<circle class="star" style="animation-delay:.3s" cx="430" cy="124" r="2"/><circle class="star" style="animation-delay:2.4s" cx="880" cy="104" r="2.2"/>
<circle class="star" style="animation-delay:1.1s" cx="420" cy="306" r="2.4"/><circle class="star" style="animation-delay:3s" cx="506" cy="326" r="3"/>
<circle class="star" style="animation-delay:.5s" cx="596" cy="298" r="2.4"/><circle class="star" style="animation-delay:2.2s" cx="690" cy="328" r="3.2"/>
<circle class="star" style="animation-delay:1.5s" cx="786" cy="300" r="2.4"/><circle class="star" style="animation-delay:3.5s" cx="872" cy="322" r="2.8"/>
<circle class="star" style="animation-delay:2.6s" cx="470" cy="276" r="2"/><circle class="star" style="animation-delay:.8s" cx="742" cy="286" r="2"/>
</g>
<!-- dòng chảy: nhìn, hiểu, hành động -->
<path class="line" d="M150 186C330 40 500 340 690 268S960 60 1012 181" stroke="url(#flowg)" stroke-width="1.6" stroke-opacity=".35"/>
<path class="line flow" d="M150 186C330 40 500 340 690 268S960 60 1012 181" stroke="url(#flowg)" stroke-width="2.4" stroke-opacity=".9"/>
<!-- con mắt máy -->
<g class="line" stroke-width="1.6" stroke-opacity=".75">
<circle class="draw" cx="150" cy="186" r="62"/>
<circle cx="150" cy="186" r="44" stroke-opacity=".5"/>
<g class="blades" stroke-opacity=".6"><path d="M150 142 188 164M188 164 188 208M188 208 150 230M150 230 112 208M112 208 112 164M112 164 150 142"/><path d="M150 142 150 166M188 164 167 176M188 208 167 196M150 230 150 206M112 208 133 196M112 164 133 176" stroke-opacity=".5"/></g>
<circle cx="150" cy="186" r="14" fill="#161129" fill-opacity=".6"/>
<path d="M40 186C74 132 112 108 150 108s76 24 110 78c-34 54-72 78-110 78s-76-24-110-78Z" stroke-opacity=".3" class="draw"/>
</g>
<circle cx="150" cy="186" r="5" fill="#8fe3cf"/>
<!-- drone -->
<g class="hover"><g class="line" stroke-width="1.4" stroke-opacity=".5" transform="translate(316 70)">
<rect x="-12" y="-8" width="24" height="16" rx="5"/><path d="M-10-6-30-20M10-6 30-20M-10 6-30 20M10 6 30 20"/>
<ellipse cx="-32" cy="-22" rx="18" ry="5"/><ellipse cx="32" cy="-22" rx="18" ry="5"/><ellipse cx="-32" cy="18" rx="18" ry="5"/><ellipse cx="32" cy="18" rx="18" ry="5"/>
</g></g>
<!-- cánh tay robot -->
<g class="line">
<path class="draw" d="M1136 360v-30h132v30M1160 330v-28h84v28" stroke-width="1.8" stroke-opacity=".8"/>
<path d="M1202 268 1120 112" stroke-width="26" stroke-opacity=".85"/>
<path d="M1202 268 1120 112" stroke="#1b1433" stroke-width="22"/>
<g class="fore">
<path d="M1120 112 1040 158" stroke-width="20" stroke-opacity=".85"/>
<path d="M1120 112 1040 158" stroke="#1b1433" stroke-width="16"/>
<circle cx="1040" cy="158" r="11" fill="#1b1433" stroke-width="2"/>
<path d="M1032 166l-14 4-8 16M1036 170l-4 14-14 8" stroke-width="2.2"/>
<circle cx="1040" cy="158" r="3.5" fill="#ff9fc0" stroke="none"/>
</g>
<circle cx="1120" cy="112" r="17" fill="#1b1433" stroke-width="2"/>
<circle cx="1202" cy="268" r="22" fill="#1b1433" stroke-width="2"/>
<circle cx="1120" cy="112" r="5" fill="#8fe3cf" stroke="none"/>
<circle cx="1202" cy="268" r="6" fill="#8fe3cf" stroke="none"/>
<path d="M1202 222v-14M1242 268h14M1162 268h-14M1235 235l10-10" stroke-width="1" stroke-opacity=".5"/>
</g>
<!-- tia sáng chạy từ mắt tới bàn tay -->
<g class="spark"><circle r="14" fill="#ffffff" opacity=".55" filter="url(#glow)"/><circle r="4.5" fill="#ffffff"/></g>
<!-- chữ -->
<g class="rise">
<text x="640" y="204" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="104" letter-spacing="2" fill="url(#nameg)">Ho Le Na</text>
</g>
<g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="7" text-anchor="middle">
<text class="w" x="506" y="252">vision</text>
<text class="w w2" x="640" y="252">language</text>
<text class="w w3" x="780" y="252">action</text>
</g>
</g>
</svg>
